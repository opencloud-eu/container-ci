---
variables:
  - &buildx_plugin 'docker.io/woodpeckerci/plugin-docker-buildx:latest'
  # TODO: Enable quay registry once the repo is available
  # - &publish_repos 'opencloudeu/desktop-client-build,quay.io/opencloudeu/desktop-client-build'
  - &publish_repos 'opencloudeu/desktop-client-build'
  - &publish_platforms 'linux/amd64'
  - publish_logins: &publish_logins
      - registry: https://index.docker.io/v1/
        username:
          from_secret: docker_username
        password:
          from_secret: docker_password
      - registry: https://quay.io
        username:
          from_secret: quay_username
        password:
          from_secret: quay_password
      - registry: https://registry.heinlein.group
        username:
          from_secret: harbor_opencloud_user
        password:
          from_secret: harbor_opencloud_password
  - image_tags: &image_tags
      - latest
      - ubuntu-qt6.10
      - ubuntu-24.04-qt6.10
  # Craft clones several repositories from github.com during the build. Anonymous
  # clones are rate limited per IP and rejected with HTTP 401 once exhausted, so
  # the build authenticates with a token, consumed by
  # desktop-client-build/scripts/with-github-auth.sh as BuildKit secret GITHUB_TOKEN.
  #
  # The token is passed as a plugin *setting* (which the plugin exposes to the
  # build as the env var PLUGIN_GITHUB_TOKEN), not via `environment`: a step with
  # `environment` no longer counts as a plugin for Woodpecker and loses the
  # privileges the nested docker daemon needs. The `\,` in the secrets entry is
  # the plugin's escape for a literal comma, so it becomes a single
  # `--secret id=GITHUB_TOKEN,env=PLUGIN_GITHUB_TOKEN` for docker buildx.
  #
  # The Woodpecker secret `github_public_readonly_token` must be enabled for
  # pull_request events for the dryrun step.
  - github_token: &github_token
      from_secret: github_public_readonly_token
  - build_secrets: &build_secrets
      - 'id=GITHUB_TOKEN\,env=PLUGIN_GITHUB_TOKEN'
when:
  - event: [push, manual, cron]
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path:
      - 'desktop-client-build/**'
      - '.woodpecker/desktop-client-build.yml'
  - event: pull_request
  - event: tag

steps:
  - name: dryrun
    image: *buildx_plugin
    settings:
      context: ./desktop-client-build
      dockerfile: desktop-client-build/Dockerfile.multiarch
      dry_run: true
      github_token: *github_token
      http_proxy:
        from_secret: ci_http_proxy
      https_proxy:
        from_secret: ci_http_proxy
      platforms: *publish_platforms
      pull_image: true
      repo: *publish_repos
      secrets: *build_secrets
      tags: *image_tags
    when:
      - event: pull_request

  - name: build-and-push
    image: *buildx_plugin
    settings:
      auto_tag: true
      context: ./desktop-client-build
      default_tag: commit-${CI_COMMIT_SHA}
      dockerfile: desktop-client-build/Dockerfile.multiarch
      github_token: *github_token
      http_proxy:
        from_secret: ci_http_proxy
      https_proxy:
        from_secret: ci_http_proxy
      logins: *publish_logins
      platforms: *publish_platforms
      repo: *publish_repos
      secrets: *build_secrets
      tags: *image_tags
    when:
      - branch: ${CI_REPO_DEFAULT_BRANCH}
        event:
          - push
      - event: tag
