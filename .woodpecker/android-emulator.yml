---
variables:
  - &buildx_plugin 'docker.io/woodpeckerci/plugin-docker-buildx:latest'
  - &publish_repos 'opencloudeu/android-emulator-ci,quay.io/opencloudeu/android-emulator-ci'
  - &publish_platforms 'linux/amd64'
  - publish_logins: &publish_logins
      - registry: https://index.docker.io/v1/
        username:
          from_secret: docker_username
        password:
          from_secret: docker_password
      - registry: https://quay.io
        username:
          from_secret: quay_username
        password:
          from_secret: quay_password
      - registry: https://registry.heinlein.group
        username:
          from_secret: harbor_opencloud_user
        password:
          from_secret: harbor_opencloud_password

labels:
  platform: android-emulator

when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path:
      - 'android-emulator/**'
      - '.woodpecker/android-emulator.yml'
  - event: pull_request
  - event: [tag, manual, cron]

steps:
  - name: dryrun
    image: *buildx_plugin
    settings:
      context: ./android-emulator
      dockerfile: android-emulator/Dockerfile.multiarch
      dry_run: true
      platforms: *publish_platforms
      pull_image: true
      repo: *publish_repos
      tag: pr-${CI_COMMIT_PULL_REQUEST}
    when:
      - event: pull_request

  - name: build-and-push
    image: *buildx_plugin
    settings:
      auto_tag: true
      context: ./android-emulator
      default_tag: commit-${CI_COMMIT_SHA}
      dockerfile: android-emulator/Dockerfile.multiarch
      build_args:
        GPU_ACCELERATED: true
      logins: *publish_logins
      platforms: *publish_platforms
      repo: *publish_repos
      tags:
        - latest
        - api-36
        - android-16
    when:
      - branch: ${CI_REPO_DEFAULT_BRANCH}
        event:
          - push
